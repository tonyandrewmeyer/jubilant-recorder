[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jubilant-recorder"
version = "0.1.0"
requires-python = ">=3.11"
description = "Record a live jubilant session and replay it as a pytest integration test."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tony Meyer", email = "jtr@aotearoa.dev" }]
keywords = ["juju", "jubilant", "testing", "pytest", "record-replay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    # 1.10 is the floor because of what codegen *emits*, not what the
    # recorder calls: `add_machine` landed in 1.10, and `show_model`,
    # `model_constraints`, `add_ssh_key` and `version` in 1.9. A generated
    # test that calls a method the installed jubilant does not have is worse
    # than one that never offered to, so the promise is made by the
    # dependency rather than by a footnote.
    "jubilant>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The libjuju recording front-end (jubilant_recorder.extensions.libjuju) taps
# python-libjuju's RPC layer, so it needs that library. Everything else in the
# package drives the juju CLI through jubilant and does not.
libjuju = [
    "juju>=3.5",
]
dev = [
    "pytest>=8",
    "ruff==0.16.0",
    "pyright>=1.1",
]

[project.entry-points.pytest11]
# Registered so that `pytest --jtr-record=...` works in an existing suite
# with no conftest edit — migrating a charm's tests should not require
# touching the tests being migrated. The plugin installs nothing and hooks
# nothing unless one of its options is passed.
jubilant_recorder = "jubilant_recorder.pytest_plugin"

[project.scripts]
jubilant-recorder = "jubilant_recorder.cli:main"
jtr = "jubilant_recorder.jtr_cli:main"

[project.urls]
Homepage = "https://github.com/tonyandrewmeyer/jubilant-recorder"
Issues = "https://github.com/tonyandrewmeyer/jubilant-recorder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jubilant_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "e2e: needs a real Juju controller; deselected unless --e2e or JTR_E2E is set",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures/golden"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.ruff]
src = ["src", "tests"]
# Generated codegen output, committed verbatim so a diff shows codegen moving.
# Formatting it would make it stop matching what the generator emits.
extend-exclude = ["tests/fixtures/golden", "examples/libjuju/generated_test.py"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "E501",
    # Method docstrings are not mandated; module/class/function docs are.
    "D102",
    # This tool deliberately shells out to juju/charmcraft/snap.
    "S603",
    "S607",
    # Prose uses real typography (en dashes, ×, curly quotes); these are
    # intentional, not homoglyph mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
    # A recorder must never break the session it is recording: failures to
    # record are swallowed deliberately, and the shim's job is to exec the
    # real juju binary.
    "S110",
    "S112",
    "S606",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_jtr_cli_shell_install.py" = ["S604"]  # Exercises shell install.
"**/tests/**" = ["B011", "D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
