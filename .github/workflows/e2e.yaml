name: End-to-end

# These deploy real charms to a real controller, so they are slow and are not
# run on every push. They gate a release, and can be started by hand.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.cloud }} — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # A genuine cross product of both keys, rather than `include:` entries
      # merged onto a base key — GitHub applies an `include` object to every
      # combination it does not conflict with, which for several objects all
      # setting the same key is not the cross product it looks like.
      #
      # Both clouds, because juju forks on the cloud type in ways the
      # recorder has to follow: `scale-application` versus `add-unit`,
      # `remove-unit`'s `--num-units`, the `--container` flags, `trust
      # --scope cluster`, and the shape of `juju status --format json`. A
      # machine-only run leaves every one of those unexercised. The suite
      # picks its charm from the controller's cloud — see the `test_charm`
      # fixture in tests/e2e/conftest.py.
      matrix:
        cloud: [machine, microk8s]
        suite:
          - test_scripted_mode
          - test_run_mode
          - test_shell_capture_mode
          - test_shell_capture_capture
          - test_libjuju_mode
          - test_pytest_plugin_mode
          - test_cross_model_mode
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Provision Juju
        run: |
          sudo snap install --classic concierge
          sudo concierge prepare -p ${{ matrix.cloud }}

      # The e2e fixtures skip when they cannot find a controller, which would
      # otherwise let a broken provisioning step report a green, empty run.
      - name: Check the controller is reachable
        run: |
          juju controllers
          juju whoami

      # JTR_E2E_REQUIRE turns "no controller, skipping" into a failure, so a
      # broken provisioning step cannot report a green run that tested nothing.
      - name: End-to-end tests
        env:
          JTR_E2E_REQUIRE: "1"
        run: |
          uv run --extra dev --extra libjuju \
            --with pytest-operator --with pytest-asyncio \
            pytest "tests/e2e/${{ matrix.suite }}.py" --e2e -v

      - name: Juju status on failure
        if: failure()
        run: |
          juju models || true
          for m in $(juju models --format json | python3 -c \
            'import json,sys;print(" ".join(m["short-name"] for m in json.load(sys.stdin)["models"]))'); do
            echo "--- $m ---"
            juju status -m "$m" || true
            juju debug-log -m "$m" --replay --no-tail --lines 100 || true
          done
