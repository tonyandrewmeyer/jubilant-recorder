name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# A second push to a PR makes the first run's answer irrelevant.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Run through the dev extra rather than uvx, so the version resolved here
      # is the one pinned in pyproject.toml and CI cannot drift from local runs.
      - name: Lint
        run: uv run --extra dev ruff check --output-format=github .

      - name: Check formatting
        run: uv run --extra dev ruff format --check --diff .

  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # With the libjuju extra, so the extension is type-checked against the
      # real python-libjuju rather than skipped as an unresolved import.
      - name: Type check
        run: uv run --extra dev --extra libjuju pyright

  unit:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is entirely fixture-driven: no Juju controller is needed.
      # The end-to-end tests that do need one live in e2e.yaml.
      - name: Unit tests
        run: uv run --extra dev pytest -v

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build sdist and wheel
        run: uv build

      # The libjuju extension lives under src/ precisely so that it ships;
      # a packaging regression here breaks `generate --source-aware` for
      # everyone who installed from PyPI rather than a checkout.
      - name: Check the extension is in the wheel
        run: |
          python -m zipfile -l dist/*.whl \
            | grep -q 'jubilant_recorder/extensions/libjuju/source_overlay.py'

      - name: Check the package imports from an install
        run: |
          uv venv /tmp/installcheck
          VIRTUAL_ENV=/tmp/installcheck uv pip install dist/*.whl
          /tmp/installcheck/bin/python -c \
            'import jubilant_recorder.extensions.libjuju.source_overlay as m; print(m.__file__)'
          /tmp/installcheck/bin/jubilant-recorder --help > /dev/null
          /tmp/installcheck/bin/jtr --help > /dev/null
